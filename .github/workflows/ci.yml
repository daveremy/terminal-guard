name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck-and-tests:
    runs-on: ubuntu-latest
    # Two runs hung to GitHub's 6h default on 2026-07-31, burning ~730 runner-minutes.
    # Normal runtime is ~2-3 min; anything past 10 is a hang, not a slow run.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -x install.sh uninstall.sh src/terminal-guard.sh src/terminal-guard-update.sh test/test-commands.sh scripts/release.sh
      - name: Run tests
        run: |
          ./test/test-commands.sh
          ./test/test-update.sh
